<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Permafrost Test App</title>
  </head>
  <body>
    <h1>Permafrost Test App</h1>
    <a
      href="{{TEST_APP_FRONTEND_URL}}/authorize?client_id={{TEST_APP_CLIENT_ID}}&scope={{TEST_APP_SCOPES}}&redirect_uri={{TEST_APP_REDIRECT_URI}}&state=1234"
      >Click here to authorize</a
    >
    <ul>
      <li>TEST_APP_FRONTEND_URL: {{TEST_APP_FRONTEND_URL}}</li>
      <li>TEST_APP_CLIENT_ID: {{TEST_APP_CLIENT_ID}}</li>
      <li>TEST_APP_SCOPES: {{TEST_APP_SCOPES}}</li>
      <li>TEST_APP_REDIRECT_URI: {{TEST_APP_REDIRECT_URI}}</li>
    </ul>
  </body>
</html>
