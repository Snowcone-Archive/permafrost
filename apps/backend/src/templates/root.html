<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Permafrost</title>
    <link rel="shortcut icon" href="/static/favicon.png" type="image/png" />
  </head>
  <body>
    <header>
      <div class="logo"></div>
      <h1>Permafrost <small>{version}</small></h1>
    </header>
    <main>
      <p>
        Authentication gateway for
        <a href="https://snowflake.blue/" target="_blank" rel="noreferrer">
          Snowflake
        </a>
      </p>
      <small>
        This page is not part of the actual application, and is served by the
        backend server.
      </small>
      <a class="launcher" href="{frontendURL}">Open Frontend</a>
    </main>
  </body>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap");

    body,
    html {
      padding: 0;
      margin: 0;
      width: 100vw;
      height: 100vh;

      background-color: #17192c;
      color: #fff;

      font-family: "Inter", "Roboto", "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      overflow: hidden;

      gap: 2.5rem;
    }

    .launcher {
      max-width: 100%;
      width: 25vw;
      min-width: 50%;
      border-radius: 0.5rem;
      border: 1px solid transparent;
      height: 3.5rem;
      background-color: #2f314b;
      color: #c8cbea;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s all;
      padding: 0 20px;
      margin: 3vh;
      filter: brightness(1);
      box-shadow: 0px 0px 0px 1px rgba(0, 0, 0, 0.25), 0 0 #0000, 0 0 #0000,
        0 0 #0000;
      border-top-color: #fff2;
      border-top-width: 1px;
    }

    .launcher:hover {
      filter: brightness(1.25);
      text-decoration: none;
    }

    h1,
    p {
      padding: 0;
      margin: 0;
    }

    header {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 2rem;
    }

    header .logo {
      width: 7.5rem;
      height: 7.5rem;

      background-color: #2f3258;
      background-image: linear-gradient(to top, #0005 0%, #0000 50%),
        url(/static/logo.svg);
      background-size: 100%;
      background-position: 50%;
      border-top: 2px solid #fff2;
      border-radius: 1.5rem;

      animation-name: fancy-boxshadow;
      animation-duration: 10s;
      animation-iteration-count: infinite;
      animation-direction: alternate;
    }

    header h1 {
      font-size: 4.5rem;
    }

    header h1 small {
      font-size: 2rem;
    }

    main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 0.25rem;

      font-size: 2rem;
      color: #898dae;
    }

    a {
      color: inherit;
      text-decoration: none;
      filter: brightness(1.5);
      cursor: pointer;
    }

    a:hover {
      text-decoration: underline;
    }

    main small {
      opacity: 0.7;
      font-size: 1rem;
    }

    @media only screen and (max-width: 1000px) {
      body {
        gap: 0.5rem;
      }

      header {
        flex-direction: column;
      }

      header h1 {
        font-size: 3rem;
      }

      header h1 small {
        font-size: 1.5rem;
      }

      main {
        font-size: 1.5rem;
      }

      main small {
        max-width: calc(100% - 5rem);
        font-size: 0.75rem;
      }
    }

    @media only screen and (max-width: 500px) {
      header h1 {
        display: flex;
        flex-direction: column;
        font-size: 1rem;
        align-items: center;
      }
    }

    @keyframes fancy-boxshadow {
      0% {
        box-shadow: 0px 5px 50px rgba(0, 0, 0, 0.25) /* Inner circle */,
          10px -10px 25px rgba(95, 130, 255, 0.3) /* Top right */,
          -10px -10px 25px rgba(5, 255, 240, 0.3) /* Top left */,
          10px 10px 25px rgba(79, 86, 249, 0.3) /* Bottom right */,
          -10px 10px 25px rgba(130, 195, 255, 0.3) /* Bottom left */;
      }

      25% {
        box-shadow: 0px 5px 50px rgba(0, 0, 0, 0.25),
          10px -10px 25px rgba(130, 195, 255, 0.3),
          -10px -10px 25px rgba(95, 130, 255, 0.3),
          10px 10px 25px rgba(5, 255, 240, 0.3),
          -10px 10px 25px rgba(79, 86, 249, 0.3);
      }

      50% {
        box-shadow: 0px 5px 50px rgba(0, 0, 0, 0.25),
          10px -10px 25px rgba(79, 86, 249, 0.3),
          -10px -10px 25px rgba(130, 195, 255, 0.3),
          10px 10px 25px rgba(95, 130, 255, 0.3),
          -10px 10px 25px rgba(5, 255, 240, 0.3);
      }

      75% {
        box-shadow: 0px 5px 50px rgba(0, 0, 0, 0.25),
          10px -10px 25px rgba(5, 255, 240, 0.3),
          -10px -10px 25px rgba(79, 86, 249, 0.3),
          10px 10px 25px rgba(130, 195, 255, 0.3),
          -10px 10px 25px rgba(95, 130, 255, 0.3);
      }

      100% {
        box-shadow: 0px 5px 50px rgba(0, 0, 0, 0.25),
          10px -10px 25px rgba(95, 130, 255, 0.3),
          -10px -10px 25px rgba(5, 255, 240, 0.3),
          10px 10px 25px rgba(79, 86, 249, 0.3),
          -10px 10px 25px rgba(130, 195, 255, 0.3);
      }
    }

    @keyframes rotate {
      100% {
        transform: rotate(1turn);
      }
    }
  </style>
</html>
